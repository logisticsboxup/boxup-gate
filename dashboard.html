<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoxUp Gate System</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--forest:#16311F;--cream:#FAF7EF;--ink:#161512;--muted:#7A776C;--gold:#B98F4E;--line:#E4DED0;
--ok:#1E7B3C;--okb:#E3F4E8;--warn:#9A6400;--warnb:#FFF3D6;--bad:#9E2B25;--badb:#FBE4E2;--part:#1D5C96;--partb:#E2EEFA;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);font-family:Inter,sans-serif;color:var(--ink);min-height:100vh}
.top{background:var(--forest);color:#fff;padding:16px 28px;display:flex;align-items:center;gap:16px}
.top h1{font-family:'Playfair Display';font-size:24px;flex:1}
.top h1 small{display:block;font:600 11px Inter;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
.pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;font:600 13px Inter;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#7CDB98}
.wrap{padding:22px 28px;display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.k{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;border-top:5px solid var(--forest)}
.k .n{font-size:34px;font-weight:800;margin:4px 0}
.k .l{font:700 11.5px Inter;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.k .s{font-size:12.5px;color:var(--muted)}
.k.ok{border-top-color:var(--ok)} .k.ok .n{color:var(--ok)}
.k.part{border-top-color:var(--part)} .k.part .n{color:var(--part)}
.k.warn{border-top-color:var(--gold)} .k.warn .n{color:var(--warn)}
.k.bad{border-top-color:var(--bad)} .k.bad .n{color:var(--bad)}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{font-family:'Playfair Display';font-size:18px;color:var(--forest);margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 span{font:600 12px Inter;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:0 4px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar i{display:block;width:100%;background:var(--forest);border-radius:6px 6px 0 0}
.bar i.now{background:var(--gold)}
.bar b{font-size:12px}
.xl{display:flex;gap:14px;padding:6px 4px 0}.xl span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.cr{display:grid;gap:12px}
.cr .r{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.track{height:12px;background:#F1EDE2;border-radius:99px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.cr .r em{font-style:normal;color:var(--muted);font-size:12.5px;text-align:right}
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:12px;margin-bottom:9px;font-size:13.5px}
.alert b{display:block}
.alert .t{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.a-bad{background:var(--badb);color:var(--bad)} .a-warn{background:var(--warnb);color:var(--warn)} .a-part{background:var(--partb);color:var(--part)}
.ic{font-size:18px;line-height:1}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font:700 11px Inter;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #F1EDE2}
td.o{font-weight:700}
.chip{font:800 11px Inter;padding:4px 9px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--okb);color:var(--ok)}.c-part{background:var(--partb);color:var(--part)}.c-warn{background:var(--warnb);color:var(--warn)}.c-bad{background:var(--badb);color:var(--bad)}
.guard{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F1EDE2;font-size:13.5px}
.guard:last-child{border:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font-weight:700}
.guard .m{flex:1}.guard .m span{display:block;color:var(--muted);font-size:12px}
.guard .n{font-weight:800;color:var(--forest);font-size:18px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:6px 0}
.rc{display:flex;flex-direction:column;align-items:center;gap:12px}
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center}
.ring .in{width:136px;height:136px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:50px;font-weight:800;line-height:1}
.ring .in span{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}
.rl{font:700 13px Inter;color:var(--ink);letter-spacing:.06em;text-transform:uppercase}
</style>
<style>
.tabs{display:flex;gap:6px;margin-right:auto;margin-left:24px}
.tabs a{color:#fff;text-decoration:none;font:700 13.5px Inter;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
.tabs a.on{background:var(--gold);border-color:var(--gold)}
@media (max-width:640px){.tabs{margin-left:0;order:3;width:100%}.tabs a{flex:1;text-align:center}.top .pill{display:none}}
.top h1{flex:none}
.wrap{max-width:1440px;margin:0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cat{border-top:5px solid #7A4CB4}.cat.c2b{border-top-color:#1D5C96}
.cat.c2c h2{color:#5B2E91}.cat.c2b h2{color:#1D5C96}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.st{background:#FBFAF6;border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center}
.st b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.st span{display:block;font:700 11px Inter;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.st.k1 b{color:var(--forest)}.st.k2 b{color:var(--ok)}.st.k3 b{color:var(--warn)}.st.k4 b{color:var(--part)}
.seg{display:inline-flex;background:#F1EDE2;border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;font:700 12.5px Inter;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--forest);color:#fff}
.tag{display:inline-block;font:800 10.5px Inter;letter-spacing:.06em;padding:3px 7px;border-radius:6px}
.t-B2C{background:#EDE4F7;color:#5B2E91}.t-B2B{background:#E0EEF7;color:#1D5C96}
.pscroll{max-height:420px;overflow:auto}
.bkt{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.bkt-hd{display:flex;align-items:center;gap:12px;background:#F4F1E8;padding:10px 14px;font-size:13.5px}
.bkt-hd b{color:var(--forest)}.bkt-hd span{color:var(--muted);font-weight:600}.bkt-hd em{margin-left:auto;font-style:normal;font-weight:700;color:var(--ok)}.bkt-hd em i{font-style:normal;color:var(--bad)}
.bkt-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid #F1EDE2;font-size:13.5px}
.bkt-row .o{font-weight:700;min-width:120px}.bkt-row .nm{flex:1;color:var(--muted)}.bkt-row .bx{width:70px;color:var(--muted);font-weight:600}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:640px){.stats4{grid-template-columns:repeat(2,1fr)}}
.ring{transition:background .4s}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.err{background:var(--badb);color:var(--bad);border-radius:12px;padding:12px 16px;font-weight:600;font-size:14px}
.err[hidden]{display:none}
select.pill{appearance:none;color:#fff;cursor:pointer}
select.pill option{color:#000}
@media (max-width:1100px){.rings{grid-template-columns:repeat(3,1fr);row-gap:22px}.grid{grid-template-columns:1fr}}
@media (max-width:640px){.rings{grid-template-columns:repeat(2,1fr)}.ring{width:130px;height:130px}.ring .in{width:104px;height:104px}.ring .in b{font-size:32px}
 .top{flex-wrap:wrap}.wrap{padding:14px}table{font-size:12.5px}th:nth-child(4),td:nth-child(4),th:nth-child(6),td:nth-child(6){display:none}}
</style></head><body>
<div class="top">
  <h1><small>BoxUp · Security Gate</small>Gate System</h1>
  <nav class="tabs"><a href="./">&#128247; Scanner</a><a class="on" href="dashboard.html">&#128202; System</a></nav>
  <div class="pill"><span class="dot" id="dot"></span><span id="upd">Loading…</span></div>
  <div class="pill" id="today"></div>
  <div class="pill" id="duty">&#128737; On duty: -</div>
</div>
<div class="wrap">
  <div class="err" id="err" hidden></div>
  <div class="card"><div class="rings" id="rings"></div></div>
  <div class="grid2">
    <div class="card cat c2c"><h2>B2C <span>Order ID BoxUp + number</span></h2><div class="stats4" id="catB2C"></div></div>
    <div class="card cat c2b"><h2>B2B <span>all other orders</span></h2><div class="stats4" id="catB2B"></div></div>
  </div>
  <div class="card"><h2>Pending orders <span class="seg"><button data-p="today" class="on">Today</button><button data-p="all">All</button></span></h2><div id="pend"></div></div>
  <div class="grid">
    <div class="card"><h2>Recent scanned (Bucket) <span id="latestN"></span></h2><div id="latest"></div></div>
    <div style="display:grid;gap:18px;align-content:start">
      <div class="card"><h2>Needs attention <span id="attN"></span></h2><div id="att"></div></div>
    </div>
  </div>
</div>
<script>
/* Same Apps Script web app as the Shipping Label Generator and the Gate Scanner */
const LOG_URL = 'https://script.google.com/macros/s/AKfycbxkWlpzmubWJwgFQF7cCDAegDHDFpst-j2AnoLVrk3rVnZL9CuOukEIC_GR43gUlL7e/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('today').innerHTML = '&#128197; ' + new Date().toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});

function ring(n, label, sub, color, pct){
  pct = Math.max(0, Math.min(100, pct || 0));
  return `<div class="rc"><div class="ring" style="background:conic-gradient(${color} 0 ${pct}%, #EEE9DC ${pct}% 100%)"><div class="in"><b style="color:${color}">${n}</b></div></div><div class="rl">${label}</div></div>`;
}
const isOut = r => r.status === 'DISPATCHED' || r.status === 'PARTIAL';
const isProb = r => r.status === 'NOT FOUND' || r.status === 'ALREADY OUT' || r.status === 'MISMATCH';
function hourOf(at){ const m = String(at).match(/(\d+):(\d+)\s*(am|pm)/i); if(!m) return null; let h = +m[1] % 12; if(/pm/i.test(m[3])) h += 12; return h; }
function hourLabel(h){ return (h % 12 || 12) + (h < 12 ? ' am' : ' pm'); }

const catOf = id => /^boxup\s*-?\s*\d+/i.test(String(id || '').trim()) ? 'B2C' : 'B2B';
let SCANS = [], SUM = { today: [], pendingAll: [] }, PMODE = 'today';
const isDone = o => /^dispatched/i.test(o.status);

function render(){
  const list = SCANS, today = SUM.today || [], pAll = SUM.pendingAll || [];
  const todayPend = today.filter(o => !isDone(o));
  const scannedOrders = new Set(list.filter(isOut).map(r => String(r.orderid).toLowerCase()));
  // four circles
  $('rings').innerHTML =
    ring(today.length, 'Today Order', 'labels printed today', '#16311F', 100) +
    ring(todayPend.length, 'Pending', today.length ? `of ${today.length} today` : 'today', '#9A6400', today.length ? todayPend.length / today.length * 100 : 0) +
    ring(scannedOrders.size, 'Scanned', `${list.filter(isOut).length} boxes out today`, '#1E7B3C', today.length ? Math.min(100, scannedOrders.size / today.length * 100) : (scannedOrders.size ? 100 : 0)) +
    ring(pAll.length, 'Pending (All)', 'not yet out, any day', '#1D5C96', pAll.length ? 100 : 0);
  // B2C / B2B
  ['B2C', 'B2B'].forEach(c => {
    const t = today.filter(o => (o.category || catOf(o.orderid)) === c);
    const d = t.filter(isDone).length, p = t.length - d;
    const sc = list.filter(r => isOut(r) && catOf(r.orderid) === c).length;
    $('cat' + c).innerHTML = `<div class="st k1"><b>${t.length}</b><span>Dispatch schedule today</span></div>
      <div class="st k2"><b>${d}</b><span>Dispatched</span></div>
      <div class="st k3"><b>${p}</b><span>Pending</span></div>
      <div class="st k4"><b>${sc}</b><span>Scanned (boxes)</span></div>`;
  });
  // pending list
  const pl = PMODE === 'today' ? todayPend : pAll;
  $('pend').innerHTML = pl.length ? `<div class="pscroll"><table><tr><th>Order ID</th><th>Type</th><th>Customer</th><th>City</th><th>Courier</th><th>Boxes</th><th>Printed</th><th>Status</th></tr>${
    pl.map(o => { const c = o.category || catOf(o.orderid); return `<tr><td class="o">${esc(o.orderid)}</td><td><span class="tag t-${c}">${c}</span></td><td>${esc(o.name)}</td><td>${esc(o.city)}</td><td>${esc(o.courier)}</td><td>${esc(o.boxes)}</td><td>${esc(o.printed)}</td><td><span class="chip ${/^partly/i.test(o.status) ? 'c-part' : 'c-warn'}">${esc(o.status)}</span></td></tr>`; }).join('')}</table></div>`
    : `<div class="empty">${PMODE === 'today' ? 'Nothing pending from today.' : 'Nothing pending.'}</div>`;
  const chip = r => ({ DISPATCHED:['c-ok','DISPATCHED'], PARTIAL:['c-part',`BOX ${r.box}/${r.total}`], 'ALREADY OUT':['c-warn','ALREADY OUT'], 'NOT FOUND':['c-bad','NOT FOUND'], MISMATCH:['c-bad','MISMATCH'] }[r.status] || ['c-warn', r.status]);
  // recent scanned, grouped by bucket (one Done = same guard, same minute)
  const buckets = [];
  list.forEach(r => { const k = (r.by || '') + '|' + r.at; const last = buckets[buckets.length - 1];
    if(last && last.k === k) last.rows.push(r); else buckets.push({ k, at: r.at, by: r.by, rows: [r] }); });
  $('latestN').textContent = buckets.length ? `${buckets.length} bucket${buckets.length > 1 ? 's' : ''} today` : '';
  $('latest').innerHTML = buckets.length ? '<div class="pscroll">' + buckets.slice(0, 15).map(bk => {
    const out = bk.rows.filter(isOut).length, bad = bk.rows.filter(isProb).length;
    return `<div class="bkt"><div class="bkt-hd"><b>&#129530; Bucket · ${esc(bk.at)}</b><span>${esc(bk.by || '')}</span><em>${out} box${out === 1 ? '' : 'es'} out${bad ? ` · <i>${bad} problem${bad > 1 ? 's' : ''}</i>` : ''}</em></div>
      ${bk.rows.map(r => { const [c, t] = chip(r); const cat = r.status === 'NOT FOUND' ? '' : catOf(r.orderid);
        return `<div class="bkt-row"><span class="o">${esc(r.orderid)}</span>${cat ? `<span class="tag t-${cat}">${cat}</span>` : ''}<span class="nm">${esc(r.name || (r.status === 'NOT FOUND' ? 'Not in log' : ''))}${r.courier ? ' · ' + esc(r.courier) : ''}</span><span class="bx">${r.box ? 'Box ' + esc(r.box) + '/' + esc(r.total) : ''}</span><span class="chip ${c}">${esc(t)}</span></div>`; }).join('')}</div>`;
  }).join('') + '</div>' : '<div class="empty">No scans yet today.</div>';
  // attention
  const probs = list.filter(isProb), att = [];
  probs.forEach(r => att.push(r.status === 'NOT FOUND'
    ? `<div class="alert a-bad"><span class="ic">&#10006;</span><div><b>${esc(r.orderid)} not found</b>Box stopped at gate, check the label</div><span class="t">${esc(r.at)}</span></div>`
    : `<div class="alert a-warn"><span class="ic">&#9888;</span><div><b>${esc(r.orderid)} scanned again</b>Check for a duplicate label</div><span class="t">${esc(r.at)}</span></div>`));
  pAll.filter(o => /^partly/i.test(o.status)).forEach(o => att.push(`<div class="alert a-part"><span class="ic">&#9203;</span><div><b>${esc(o.orderid)}: ${esc(o.status)}</b>Remaining boxes still inside</div><span class="t"></span></div>`));
  $('attN').textContent = att.length ? att.length + ' open' : '';
  $('att').innerHTML = att.length ? att.slice(0, 10).join('') : '<div class="empty">All clear.</div>';
  $('duty').innerHTML = '&#128737; On duty: ' + esc(list[0] && list[0].by || '-');
}
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { PMODE = b.dataset.p; document.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('on', x === b)); render(); });

async function getJSON(action){
  const res = await fetch(LOG_URL + '?action=' + action + '&t=' + Date.now());
  let d = null; try{ d = await res.json(); }catch(e){}
  if(!d || d.ok === undefined) throw new Error('The Google Sheet script is not up to date (deploy the latest version).');
  if(!d.ok) throw new Error(d.error || 'Sheet error');
  return d;
}
async function load(){
  try{
    const [t, s] = await Promise.all([getJSON('gatetoday'), getJSON('gatesummary')]);
    SCANS = t.list || []; SUM = s;
    $('err').hidden = true; render();
    $('dot').style.background = '#7CDB98';
    $('upd').textContent = 'Live · updated ' + new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    $('dot').style.background = '#F0A35E';
    $('upd').textContent = 'Not updated';
    $('err').hidden = false; $('err').textContent = e.message === 'Failed to fetch' ? 'Could not reach the Google Sheet. Check the internet.' : e.message;
  }
}
load(); setInterval(load, 30000);
</script>
</body></html>
